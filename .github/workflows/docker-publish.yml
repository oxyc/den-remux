# Main CI builds, probes and scans an immutable candidate image for every main commit. A vX.Y.Z tag promotes the
# exact digest recorded by that successful main run: it does not compile or test the same commit again.
#
# Every Monday, and on a manual run, the NEWEST v* tag is rebuilt instead: released code only, never main,
# with the base images re-pulled and no build cache, so a fix to the Alpine base or to the OpenSSL that ffmpeg
# links reaches the box between releases — through den-update's probe and rollback, like any release. ffmpeg
# itself stays at the tag's pinned FFMPEG_VERSION; a newer one ships with a release.
#
# Signing happens only here: the box's cosign check trusts this workflow as it runs on main and on release tags.
name: docker-publish

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-remux

# One publish at a time, never cancelled: a patch rebuild and a release must not race each other to :latest.
concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions: {}

jobs:
  # What to publish. A tag push promotes that tag's candidate. A scheduled or manual run rebuilds the newest
  # vX.Y.Z tag, resolved at run time, so a release cut since the last rebuild is the one that gets patched.
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      patch: ${{ steps.pick.outputs.patch }}
      stamp: ${{ steps.pick.outputs.stamp }}
    steps:
      - name: Select released source
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            ref="$GITHUB_REF_NAME"; patch=false
          else
            # The box's cosign check trusts this workflow as it is on main and on release tags, so a run
            # from any other branch would publish an image the box refuses.
            test "$GITHUB_REF" = refs/heads/main || { echo "::error::run a patch rebuild from main, not $GITHUB_REF"; exit 1; }
            ref=$(git ls-remote --tags --refs "https://github.com/$REPO.git" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            test -n "$ref" || { echo "::error::no vX.Y.Z tag to rebuild"; exit 1; }
            patch=true
          fi
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag is not vX.Y.Z: $ref"; exit 1; }
          echo "publishing $ref (patch rebuild: $patch)"
          {
            echo "ref=$ref"
            echo "version=${ref#v}"
            echo "patch=$patch"
            echo "stamp=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  # A release consumes the digest record emitted only after the exact main workflow built, probed and scanned the
  # image, and passed its tests and e2e. Resolving by the artifact rather than a moving tag binds promotion to that run.
  candidate:
    if: github.event_name == 'push'
    needs: source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.ref }}
          persist-credentials: false
      # The startup line reports DEN_VERSION, which main CI took from VERSION, and the image tag is the git tag.
      - name: Verify tag metadata
        id: commit
        env:
          EXPECTED: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$version" = "$EXPECTED" || { echo "::error::tag says $EXPECTED but VERSION says $version — use scripts/release.sh"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find the successful exact-main CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            row=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last | if . == null then "" else [.id, .status, (.conclusion // "-")] | @tsv end')
            if [ -n "$row" ]; then
              IFS=$'\t' read -r id status conclusion <<<"$row"
              if [ "$status" = completed ]; then
                test "$conclusion" = success || { echo "::error::exact main CI $id finished $conclusion"; exit 1; }
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::no successful main CI completed for $SHA within 20 minutes"
          exit 1
      - name: Download the scanned digest record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-${{ steps.commit.outputs.sha }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify the candidate identity
        id: image
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          digest=$(jq -r .remux candidate-digest.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in the candidate record"; exit 1; }
          live=$(docker buildx imagetools inspect "$IMAGE:candidate-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          test "$live" = "$digest" || { echo "::error::candidate tag no longer matches the digest recorded by main CI"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Prove the image reports the tagged release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"

  # Security patch rebuilds intentionally bypass the candidate: their purpose is to pull fresh base packages even
  # when the source did not change. They keep the full build, probe, scan and gate.
  patch-build:
    if: github.event_name != 'push'
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Verify release metadata
        id: commit
        env:
          EXPECTED: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f VERSION ] || [ ! -f docker-bake.hcl ]; then
            echo "::error::newest tag predates the candidate pipeline; cut one release from current main before running a patch rebuild"
            exit 1
          fi
          test "$(cat VERSION)" = "$EXPECTED" || { echo "::error::tag says $EXPECTED but VERSION says $(cat VERSION)"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # Re-pull every FROM (`pull` in docker-bake.hcl) and reuse no layer: a base image or a layer served from the
      # cache is how a rebuild inherits last month's OpenSSL.
      - name: Rebuild without cache
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ needs.source.outputs.version }}
            *.args.GIT_REVISION=${{ steps.commit.outputs.sha }}
            *.no-cache=true
            remux.tags=${{ env.IMAGE }}:${{ needs.source.outputs.version }}-patch.${{ needs.source.outputs.stamp }}
            remux.cache-to=type=gha,mode=max,scope=release-image
      - name: Record the rebuilt digest
        id: image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest=$(jq -r '.remux["containerimage.digest"] // empty' <<<"$METADATA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in the bake metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Prove the rebuilt image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # A patch rebuild gates on OS packages only — the part a rebuild can fix; a vulnerable crate needs a release,
      # and holding back an OpenSSL fix until then would leave the box worse off.
      - name: Scan gate (OS packages)
        run: |
          set -euo pipefail
          jq '.Results = ((.Results // []) | map(select(.Class == "os-pkgs")))' trivy.json > gate.json
          trivy convert --severity CRITICAL --exit-code 1 --format table gate.json
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Only this workflow signs and advances :latest, preserving den-update's signature identity, throwaway probe,
  # digest pin, live probe and rollback path.
  release:
    needs: [source, candidate, patch-build]
    if: ${{ !cancelled() && needs.source.result == 'success' && ((needs.source.outputs.patch == 'false' && needs.candidate.result == 'success') || (needs.source.outputs.patch == 'true' && needs.patch-build.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write         # keyless cosign: the signing certificate is issued to this workflow's OIDC identity
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: Fulcio issues a short-lived certificate to this workflow's GitHub OIDC identity and the
      # signature is recorded in Rekor. The box verifies that identity before deploying (README, Deploy).
      - name: Sign the exact digest
        env:
          DIGEST: ${{ needs.candidate.outputs.digest || needs.patch-build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # A v1.2.3 release → :1.2.3, :1.2, :1 and :sha-<short>; a patch rebuild already carries its immutable
      # :1.2.3-patch.<date>.<run>. :latest is what den-update deploys, so it moves last, to exactly the digest
      # that was scanned and signed; imagetools re-tags a single index as-is, and the check proves it survived.
      - name: Publish release tags and move :latest last
        env:
          DIGEST: ${{ needs.candidate.outputs.digest || needs.patch-build.outputs.digest }}
          SHA: ${{ needs.candidate.outputs.sha || needs.patch-build.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          PATCH: ${{ needs.source.outputs.patch }}
        run: |
          set -euo pipefail
          if [ "$PATCH" != true ]; then
            minor=${VERSION%.*}; major=${VERSION%%.*}; short=${SHA:0:7}
            docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$minor" --tag "$IMAGE:$major" \
              --tag "$IMAGE:sha-$short" "$IMAGE@$DIGEST"
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          moved=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$moved" = "$DIGEST" || { echo "::error::latest resolved to $moved, not the signed $DIGEST"; exit 1; }
