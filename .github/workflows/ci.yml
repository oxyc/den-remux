name: ci

# Every exact main commit produces a scanned, probed, immutable candidate image while its checks run. A release
# tag only promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-remux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The #[ignore]d tests run real ffmpeg; the e2e job runs them with the image's own.
      - name: Tests
        run: cargo test --locked

  # The #[ignore]d end-to-end tests, in the Dockerfile's test stage: the ffmpeg the image ships, because
  # another version seeks differently and the segment alignment depends on exactly how it seeks. The stage
  # builds no release binary, and its own cache scope (docker-bake.hcl) keeps it from racing the image build's.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: End-to-end tests
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          targets: e2e

  # On a PR (e.g. a dependency bump) — build the image WITHOUT pushing. This is the merge gate for the
  # checksummed ffmpeg source and the static build: a bad checksum or a configure line that no longer
  # builds fails the check. It reads main's cache but does not overwrite it with an unmerged revision.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release metadata
        id: source
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image (no push)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.output=type=cacheonly

  # Main builds, probes and scans an immutable candidate while the other jobs run. It is intentionally unsigned and
  # never receives :latest here; docker-publish promotes it only after this exact workflow run has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            remux.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            remux.cache-to=type=gha,mode=max,scope=release-image
      - name: Record the candidate digest
        id: image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          digest=$(jq -r '.remux["containerimage.digest"] // empty' <<<"$METADATA")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in the bake metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Prove the image reports its release and its ffmpeg works
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"
      # One scan, of fixable HIGH and CRITICAL findings, which the report and the gate below both read. It sees the
      # Alpine base and its packages; the Rust binary and the source-built ffmpeg carry no package database, so they
      # are tracked by their pins, not by this scan.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # A CRITICAL with a fixed version available fails here, so no candidate record exists for a release to
      # promote. Unfixed CVEs were already dropped by the scan. A finding that does not apply goes in .trivyignore.
      - name: Scan gate
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg remux "$DIGEST" '{remux: $remux}' > candidate-digest.json
      - name: Save the candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digest.json
          if-no-files-found: error
          retention-days: 30
      # Advisory: the findings go to code scanning, and an outage there must not hold a release.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
