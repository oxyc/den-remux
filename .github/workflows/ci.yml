name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # docker-publish.yml calls this as its gate, so a tag cannot publish an image CI would reject.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The #[ignore]d tests run real ffmpeg; the e2e job runs them with the image's own.
      - name: Tests
        run: cargo test --locked

  # The #[ignore]d end-to-end tests, in the Dockerfile's test stage: the ffmpeg the image ships, because
  # another version seeks differently and the segment alignment depends on exactly how it seeks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: End-to-end tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a PR (e.g. a dependency bump) — build the image WITHOUT pushing. This is the merge gate for the
  # checksummed ffmpeg source and the static build: a bad checksum or a configure line that no longer
  # builds fails the check. amd64, the only arch the box runs.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
